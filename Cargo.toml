[package]
name = "up-tui"
version = "0.2.3"
edition = "2024"
description = "A terminal UI for viewing Up Banking accounts and transactions"
repository = "https://github.com/abusch/up-tui"
license = "MIT OR Apache-2.0"
keywords = ["banking", "ratatui", "terminal", "tui", "up-bank"]

[[bin]]
name = "up"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.32"
http-cache-reqwest = { version = "1.0.0-alpha.5", default-features = false, features = ["manager-moka", "reqwest-middleware", "url-standard"] }
jiff = { version = "1.0.2", features = ["serde"] }
opaline = { version = "0.4.0", features = ["widgets"] }
ratatui = "0.30.2"
ratatui-toaster = { version = "0.1.2", features = ["tokio"] }
reqwest = { version = "0.13.2", features = ["json"] }
reqwest-middleware = "0.5.1"
rootcause = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
tokio = {
  version = "1.50.0",
  default-features = false,
  features = [
    "macros",
    "net",
    "rt",
    "time",
  ]
}
toml = "1.2.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
